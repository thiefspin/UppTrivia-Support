name: UppTrivia iOS Support Request
description: Log a support issue for the UppTrivia iOS app
title: "[Support]: "
labels:
  - support
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue with UppTrivia.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the issue.
      placeholder: App crashes when opening leaderboard
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - iPhone
        - iPad
        - Other
    validations:
      required: true
  - type: input
    id: ios_version
    attributes:
      label: iOS version
      placeholder: iOS 18.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide clear, numbered steps.
      placeholder: |
        1. Open UppTrivia
        2. Tap Leaderboard
        3. App closes unexpectedly
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add screenshots, screen recordings, or any useful details.
